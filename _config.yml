about_content: | # this will include new lines to allow paragraphs
  I'm a B.S. student in **Electrical and Computer Engineering** at **Seoul National University**, currently building **physical AI for surgery** at a stealth startup.

  Previously, I was a research intern at the [SNU Computational Neuroscience Lab](https://sites.google.com/snu.ac.kr/snucnl/home) under Prof. Jeehyun Kwag, and at the [SNU Computer Vision Lab](https://cv.snu.ac.kr/) under Prof. Bohyung Han.

  I'm interested in **physical AI, reinforcement learning, and computational neuroscience** — building scalable neural technologies that work reliably in high-precision, safety-critical settings.

