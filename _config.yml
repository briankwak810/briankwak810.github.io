# About Section
about_title: About
about_profile_image: images/profile.svg
about_content: | # this will include new lines to allow paragraphs
  I'm a B.S. student in **Electrical and Computer Engineering** at **Seoul National University**, currently working at a stealth startup on **physical AI for surgery**. Before that I was a research intern at the [SNU Computational Neuroscience Lab](https://sites.google.com/snu.ac.kr/snucnl/home) (advised by Prof. Jeehyun Kwag) and the [SNU Computer Vision Lab](https://cv.snu.ac.kr/) (advised by Prof. Bohyung Han).

  My research centers on building **surgical and embodied AI systems** that scale neural technologies — from brain–computer interfaces to intelligent neurosurgical platforms. I'm drawn to systems that have to work reliably under **high-precision, safety-critical** conditions, where ideas meet physical reality.

  I think the next decade of neural tech will be bottlenecked less by what we can theorize, and more by what we can repeatably and safely build. So I spend most of my time on the boundary between **reinforcement learning, computer vision, and computational neuroscience** — the messy edge where data-efficient learning, dexterous manipulation, and neural decoding/modulation come together.

  Outside research I helped lead engineering outreach at SNU, taught STEM to high schoolers, and was awarded the Presidential Science Scholarship and the Chief of Naval Operations Award at the ROK MND Startup Competition.

