  - title: Research
    layout: list
    content:
      - layout: left
        border: weak
        title: Fine-tuning Navigation Models with Policy Optimization unveils Internal Planners
        caption: March 2025 – September 2025
        sub_title: Deep RL · Navigation Foundation Models · Diffusion Policy
        additional_links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/briankwak810
        quote: >
          Can policy optimization expose latent planning structure inside large navigation foundation models?
        description: | # this will include new lines to allow paragraphs
          Open-sourced a headless data processing, evaluation, and teleoperation pipeline for ROS-based agents in `Habitat-sim`. Contributed a novel approach to RL training of diffusion-policy based navigation models, surfacing internal planner-like representations under fine-tuning.

      - layout: left
        border: weak
        title: Network Topology of Boundary Vector Cells in Mouse Retrosplenial Cortex
        caption: June 2024 – August 2024
        sub_title: Contrastive Learning · Spatial Navigation · TDA
        additional_links:
          - title: Report (PDF)
            icon: fas fa-file-pdf
            url: /files/projects/Neural_topology_in_rsc_with_PV_interneurons.pdf
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/briankwak810
        quote: >
          How do Parvalbumin interneurons reshape the topology of spatial codes in the brain?
        description: | # this will include new lines to allow paragraphs
          Studied how PV interneurons inhibit and modulate network topology in the retrosplenial cortex using contrastive representation learning over calcium imaging data. Awarded **1st place** in the 2024 Poster Presentation Session by the SNU College of Cognitive Sciences.

      - layout: left
        border: weak
        title: Neural Topology Analysis — Visualizing Network Topology from Calcium Images
        caption: June 2024 – August 2024
        sub_title: Contrastive Learning · Calcium Imaging
        additional_links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/briankwak810
        description: | # this will include new lines to allow paragraphs
          End-to-end open-source pipeline for extracting and visualizing topological structure directly from raw calcium imaging recordings.

      - layout: left
        border: weak
        title: Novel View Refinement via Attention Fusion
        caption: March 2024 – June 2024
        sub_title: 3D Computer Vision · Stable Diffusion
        additional_links:
          - title: Report (PDF)
            icon: fas fa-file-pdf
            url: /files/projects/Novel_View_Refinement_via_Attention_Fusion.pdf
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/briankwak810
        quote: >
          Can attention fusion across views recover what a single-view generator can't?
        description: | # this will include new lines to allow paragraphs
          Open-sourced *Novel View Refinement*, a method that generates unseen object views by fusing attention layers across a diffusion backbone. Companion repo: open-sourced fine-tuning code for SV3D, the baseline used in this work.

      - layout: left
        border: weak
        title: "IMG-PFGM: Diffusion Models as Image-Charge Models"
        caption: June 2023 – February 2024
        sub_title: Diffusion Models · Electromagnetics
        additional_links:
          - title: GitHub
            icon: fab fa-github
            url: https://github.com/briankwak810
        quote: >
          What if diffusion models are quietly minimizing electrostatic energy between two charge distributions?
        description: | # this will include new lines to allow paragraphs
          Proposed a novel interpretation of diffusion models as minimizing total energy of electric fields between two charge distributions, and validated the framing on a toy model.

      - layout: left
        border: weak
        title: Non-invasive Optogenetics with Ultrasonic Waves & Sonoactive Nanoparticles
        caption: December 2023 – February 2024
